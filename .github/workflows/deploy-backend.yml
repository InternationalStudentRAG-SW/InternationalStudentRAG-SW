name: Deploy Backend

# 트리거 조건:
# - main 브랜치에 push 발생 시 (dev → main PR 머지 포함)
# - Backend/ 코드 또는 이 워크플로 파일이 변경된 경우에만 실행
on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # GHCR(GitHub Container Registry) push 권한

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. GHCR 이미지명 소문자 변환
      #    GHCR은 이미지명에 소문자만 허용
      #    GitHub 저장소명에 대문자가 있으면 빌드 실패하므로 강제 변환
      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }}/backend | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 3. GHCR 로그인
      #    GITHUB_TOKEN은 GitHub이 자동 발급 — 별도 Secrets 등록 불필요
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker 이미지 빌드 및 GHCR push
      #    context: ./Backend → Backend/Dockerfile 기준으로 빌드
      #    태그 2개:
      #      - latest: RunPod이 항상 최신 이미지를 참조
      #      - git SHA: 특정 커밋으로 롤백 시 사용
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 5. RunPod 템플릿 이미지 업데이트
      #    saveTemplate 뮤테이션으로 템플릿 이미지를 갱신하면
      #    연결된 엔드포인트에 자동으로 새 Release가 생성됨
      #    사전 등록 필요한 GitHub Secrets:
      #      - RUNPOD_API_KEY: RunPod 계정 API 키
      #      - RUNPOD_TEMPLATE_ID: 업데이트할 RunPod 템플릿 ID
      - name: Update RunPod template image
        run: |
          curl -s -X POST "https://api.runpod.io/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -d "{\"query\": \"mutation saveTemplate(\$input: SaveTemplateInput) { saveTemplate(input: \$input) { id } }\", \"variables\": {\"input\": {\"id\": \"${{ secrets.RUNPOD_TEMPLATE_ID }}\", \"imageName\": \"${{ env.IMAGE_NAME }}:${{ github.sha }}\", \"name\": \"internationalstudentrag-backend\", \"containerDiskInGb\": 20, \"dockerArgs\": \"\", \"volumeInGb\": 0, \"env\": [{\"key\": \"OPENAI_API_KEY\", \"value\": \"${{ secrets.OPENAI_API_KEY }}\"}, {\"key\": \"OPENAI_MODEL\", \"value\": \"gpt-4o-mini\"}, {\"key\": \"SUPABASE_URL\", \"value\": \"${{ secrets.SUPABASE_URL }}\"}, {\"key\": \"SUPABASE_ANON_KEY\", \"value\": \"${{ secrets.SUPABASE_ANON_KEY }}\"}, {\"key\": \"SUPABASE_SERVICE_KEY\", \"value\": \"${{ secrets.SUPABASE_SERVICE_KEY }}\"}, {\"key\": \"ADMIN_SECRET\", \"value\": \"${{ secrets.ADMIN_SECRET }}\"}, {\"key\": \"UPSTASH_REDIS_URL\", \"value\": \"${{ secrets.UPSTASH_REDIS_URL }}\"}, {\"key\": \"NEO4J_URI\", \"value\": \"${{ secrets.NEO4J_URI }}\"}, {\"key\": \"NEO4J_USER\", \"value\": \"${{ secrets.NEO4J_USER }}\"}, {\"key\": \"NEO4J_PASSWORD\", \"value\": \"${{ secrets.NEO4J_PASSWORD }}\"}, {\"key\": \"CHROMA_DB_PATH\", \"value\": \"/runpod-volume/chroma_db\"}, {\"key\": \"DOCUMENT_PATH\", \"value\": \"/runpod-volume/documents\"}, {\"key\": \"LOG_DIR\", \"value\": \"/runpod-volume/logs\"}, {\"key\": \"CORS_ORIGINS\", \"value\": \"${{ secrets.CORS_ORIGINS }}\"}]}}}"
