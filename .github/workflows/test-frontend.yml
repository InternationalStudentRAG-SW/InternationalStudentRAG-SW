name: Test Frontend

on:
  push:
    branches: [dev]
    paths:
      - 'Frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'Frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build
        working-directory: Frontend
        run: npm run build

      - name: Type check API functions
        working-directory: Frontend/api
        run: npx tsc --noEmit
